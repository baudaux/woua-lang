<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    body  { font-family: sans-serif; margin: 2rem; background: #f0f2f5; }
    h2    { margin-bottom: 0.5rem; }
    #app-container { display: inline-block; }
    #page-status { margin-top: 0.75rem; color: #555; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h2>woua input demo</h2>
  <div id="app-container"></div>
  <p id="page-status">Loading…</p>

  <script type="module">
    import { makeWorkerHandler } from '../js/dom-processor.js';

    const root   = document.getElementById('app-container');
    const status = document.getElementById('page-status');

    const worker = new Worker(
      new URL('./dom_worker.js', import.meta.url),
      { type: 'module' }
    );
    worker.onmessage = makeWorkerHandler(root, status);
    worker.postMessage({ type: 'start', wasmUrl: 'out/input_demo.wasm' });
    status.textContent = 'Running…';
  </script>
</body>
</html>
