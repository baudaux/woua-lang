<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>woua canvas demo</title>
  <style>
    body { font-family: sans-serif; padding: 1rem; background: #111; color: #eee; }
    #app-container canvas { display: block; image-rendering: pixelated; }
    #page-status { margin-top: 0.75rem; color: #888; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h2>woua canvas demo</h2>
  <div id="app-container"></div>
  <p id="page-status">Loading…</p>

  <script type="module">
    import { makeWorkerHandler } from '../js/dom-processor.js';

    const root   = document.getElementById('app-container');
    const status = document.getElementById('page-status');

    const worker = new Worker(
      new URL('./dom_worker.js', import.meta.url),
      { type: 'module' }
    );
    worker.onmessage = makeWorkerHandler(root, status);
    worker.postMessage({ type: 'start', wasmUrl: 'out/canvas_demo.wasm' });
    status.textContent = 'Running…';
  </script>
</body>
</html>
