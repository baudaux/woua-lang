name: Build wouac

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies (wouac)
        working-directory: ./wouac
        run: npm install

      - name: Build wouac
        working-directory: ./wouac
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
	with:
	  name: wouac-wasm
    	  path: dist/wouac.wasm

